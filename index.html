        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;700&display=swap');

        :root {
            --gold: #c5a059;
            --crimson: #8b0000;
            --abyss: #1a0a25;
            --bg: #0a0a0a;
        }

        body { background: var(--bg); color: #eee; font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 20px; }
        .myeongjo { font-family: 'Nanum Myeongjo', serif; }

        /* --- 이미지 슬라이더 영역 --- */
        .gallery-container {
            max-width: 800px;
            margin: 0 auto 30px;
            position: relative;
            text-align: center;
        }

        .main-img-box {
            width: 100%;
            height: 500px;
            background: #111;
            border: 1px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .main-img-box img { width: 100%; height: 100%; object-fit: cover; }

        /* 화살표 버튼 */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.5);
            color: var(--gold);
            border: none;
            font-size: 2rem;
            cursor: pointer;
            padding: 10px 15px;
            z-index: 10;
        }
        .prev { left: 10px; }
        .next { right: 10px; }

        /* 섬네일 영역 */
        .thumb-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .thumb {
            width: 60px;
            height: 80px;
            object-fit: cover;
            border: 2px solid transparent;
            cursor: pointer;
            opacity: 0.5;
        }

        .thumb.active { border-color: var(--gold); opacity: 1; }

        /* --- 캐릭터 상세 정보 카드 --- */
        .info-card {
            max-width: 800px;
            margin: 0 auto;
            background: #151515;
            border: 1px solid #333;
            padding: 40px;
            position: relative;
        }

        .info-header { border-bottom: 2px solid var(--gold); padding-bottom: 15px; margin-bottom: 20px; }
        .info-header h2 { font-size: 2.2rem; margin: 0; color: var(--gold); }
        .info-header span { font-size: 1rem; color: #888; }

        .grid-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .info-item b { color: var(--gold); margin-right: 10px; font-size: 0.9rem; }

        .quote-box {
            font-size: 1.2rem;
            color: #ccc;
            font-style: italic;
            text-align: center;
            margin: 30px 0;
            padding: 20px;
            background: rgba(197, 160, 89, 0.05);
            border-radius: 8px;
        }

        .tag-list { color: var(--gold); font-size: 0.9rem; margin-bottom: 15px; }

        .desc-section { line-height: 1.8; color: #bbb; margin-bottom: 20px; }
        
        .hl-box { 
            display: flex; 
            gap: 20px; 
            background: #111; 
            padding: 15px; 
            font-size: 0.85rem;
            border: 1px solid #222;
        }
        .hl-box b { color: var(--gold); }

    function renderGrids() {
        characters.forEach(char => {
            const card = document.createElement('div');
            card.className = 'location-tag';
            card.style.cursor = 'pointer';
            card.innerHTML = `<strong>${char.name}</strong><br><small>${char.sub}</small>`;
            card.onclick = () => openModal(char);

            if (char.faction === "제국") document.getElementById('grid-empire').appendChild(card);
            else if (char.faction === "마계") document.getElementById('grid-devildom').appendChild(card);
            else if (char.faction === "기타") document.getElementById('grid-abyss').appendChild(card);
        });
    }

    function openModal(char) {
        current = char;
        isAwake = false;
        imgIdx = 0;
        document.getElementById('charModal').classList.remove('hidden');
        document.body.style.overflow = 'hidden';
        updateUI();
    }

    function updateUI() {
        document.getElementById('mName').innerText = current.name;
        document.getElementById('mSubTitle').innerText = `${current.faction} | ${current.sub}`;
        document.getElementById('mAge').innerText = current.age;
        document.getElementById('mMBTI').innerText = current.mbti;
        document.getElementById('mHeight').innerText = current.height;
        document.getElementById('mWeight').innerText = current.weight;
        document.getElementById('mQuote').innerText = `"${current.quote}"`;
        document.getElementById('mDesc').innerText = current.desc;
        document.getElementById('mLikes').innerText = current.likes;
        document.getElementById('mDislikes').innerText = current.dislikes;

        const tagArea = document.getElementById('mTags');
        tagArea.innerHTML = current.tags.join(' ');

        updateMainPhoto();
        renderThumbs();
    }

    function renderThumbs() {
        const thumbArea = document.getElementById('thumbArea');
        thumbArea.innerHTML = '';
        const mode = isAwake ? 'T' : 'N';
        codes.forEach((code, i) => {
            const img = document.createElement('img');
            img.src = `${baseUrl}${current.id}_${mode}${code}.webp`;
            img.style.width = "50px";
            img.style.height = "60px";
            img.style.objectFit = "cover";
            img.style.cursor = "pointer";
            img.style.border = i === imgIdx ? "2px solid var(--gold)" : "2px solid transparent";
            img.onclick = () => { imgIdx = i; updateMainPhoto(); };
            thumbArea.appendChild(img);
        });
    }

    function updateMainPhoto() {
        const mode = isAwake ? 'T' : 'N';
        document.getElementById('mainImg').src = `${baseUrl}${current.id}_${mode}${codes[imgIdx]}.webp`;
        renderThumbs();
